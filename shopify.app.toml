# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f19e6148d0f330661fc2a3e5c70479d4"
name = "Miko Click and Collect"
application_url = "https://miko-click-collect-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "pratham-testing-store.myshopify.com"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Revocation half of the development-store free grant (see dev-store.server.ts).
  # Fires when the shop's plan changes, which is how a Partner dev store that
  # converts to a real paid store loses the free top plan straight away.
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  # The backstop for orders/create: a native pickup order is only identifiable
  # from its fulfillment orders, and that evidence is not always present the
  # instant the order is created. See webhooks.orders.paid.tsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  # Ready-for-pickup can be set from the Shopify order page, the mobile admin
  # or POS, not only from this app. Without this the two disagree.
  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillment_orders/line_items_prepared_for_pickup"
  topics = [ "fulfillment_orders/line_items_prepared_for_pickup" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]


[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# NOTE: the granted scopes come from THIS file, not from the SCOPES env var on
# Railway (which is stale and ignored under managed install). Verified against a
# live store's /admin/oauth/access_scopes.json.
#
# read_themes — a merchant can have pickup working at checkout while every
#   product page stays silent about it, because whether Shopify's "Pickup
#   available at ..." block renders is a theme setting and Horizon ships with it
#   OFF, so the app can tell the merchant and deep link them to the exact
#   template. Read-only on purpose: theme FILES cannot be written by a public
#   app at all. Tested with the app's own token — themeFilesUpsert returns
#   "The user needs write_themes and an exemption from Shopify to modify theme
#   files", so write_themes buys nothing and is not requested.
#
# read_locations — native pickup mode switches Shopify's local pickup on per
#   Location, so the app must be able to list the store's locations to map
#   pickup points onto them. Without it `locations` returns ACCESS_DENIED and
#   the whole native flow is dead.
#
# *_merchant_managed_fulfillment_orders — a native pickup order carries no
#   marker of ours; the only evidence that it IS a pickup order is the
#   fulfillment order's PICK_UP method and assigned location. Reading
#   `order.fulfillmentOrders` needs the read scope (a pickup location is a
#   merchant-managed location). The write scope lets the app close out a pickup
#   fulfillment when the order is marked collected.
scopes = "read_products,write_products,read_orders,write_orders,read_shipping,write_shipping,read_locations,read_themes,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_publications,write_publications"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://miko-click-collect-production.up.railway.app/auth/callback"
]
