# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f19e6148d0f330661fc2a3e5c70479d4"
name = "Miko Click and Collect"
application_url = "https://miko-click-collect-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "pratham-testing-store.myshopify.com"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Revocation half of the development-store free grant (see dev-store.server.ts).
  # Fires when the shop's plan changes, which is how a Partner dev store that
  # converts to a real paid store loses the free top plan straight away.
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/update"
  topics = [ "shop/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_locations is required for native pickup mode: Shopify switches local
# pickup on per Location, so the app has to be able to list the store's
# locations to map pickup points onto them. Without it `locations` returns
# ACCESS_DENIED and the whole native flow is dead — verified on a live store,
# because the granted scopes come from THIS file, not from the SCOPES env var.
scopes = "read_products,write_products,read_orders,write_orders,write_delivery_customizations,read_delivery_customizations,read_shipping,write_shipping,read_locations,read_publications,write_publications"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://miko-click-collect-production.up.railway.app/auth/callback"
]
