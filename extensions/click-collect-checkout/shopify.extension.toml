api_version = "2026-04"

[[extensions]]
name = "Click & Collect — Pickup Selector"
handle = "click-collect-checkout"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.tsx"
target = "purchase.checkout.delivery-address.render-before"

[extensions.capabilities]
network_access = true

[extensions.settings]
  [[extensions.settings.fields]]
  key = "app_url"
  type = "single_line_text_field"
  name = "App URL"
  description = "Base URL of the Miko Click & Collect app"
