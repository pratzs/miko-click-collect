query RunInput {
  cart {
    pickupMethod: attribute(key: "miko_pickup_method") {
      value
    }
    serviceFee: attribute(key: "miko_service_fee") {
      value
    }
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          price {
            amount
          }
        }
      }
    }
  }
}
